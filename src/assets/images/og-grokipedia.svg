  <rect x="100" y="150" width="1000" height="330" rx="20" fill="#1E293B" opacity="0.85"/>

  <!-- Logo Mark -->
  <circle cx="300" cy="315" r="80" fill="#6366F1" opacity="0.2"/>
  <text x="300" y="345" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif" font-size="60" font-weight="bold" fill="#6366F1" text-anchor="middle">GW</text>

  <!-- Title -->
  <text x="450" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif" font-size="56" font-weight="800" fill="#F8FAFC">
